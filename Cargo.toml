[package]
name = "depac"
version = "0.1.0"
edition = "2024"

[dependencies]
alpm = "5.0.2"
anyhow = "1.0.104"
git2 = "0.21.0"
owo-colors = "4.3.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "query", "native-tls"] }
rustix = { version = "1.1.4", features = ["process"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
strip = true
lto = true
